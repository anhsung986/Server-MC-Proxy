<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server MC Proxy - Quản Lý Configs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rainbow-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%); }
        .rainbow-text {
            background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #ec4899, #8b5cf6); border-radius: 3px; }
    </style>
</head>
<body class="rainbow-bg text-gray-100 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-zinc-900/70 backdrop-blur-xl border-b border-zinc-800 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-500 p-2.5 rounded-2xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-server text-white text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider rainbow-text">MC PROXY CONFIGS</h1>
                    <p class="text-xs text-zinc-400">Hệ thống quản lý cấu hình máy chủ</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="plugins.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl font-semibold transition text-sm flex items-center space-x-2 border border-zinc-700">
                    <i class="fa-solid fa-puzzle-piece text-pink-400"></i>
                    <span class="hidden sm:inline">Kho Plugins</span>
                </a>
                <button onclick="openModal()" class="bg-gradient-to-r from-pink-500 via-purple-600 to-blue-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-semibold transition-all shadow-lg shadow-purple-500/30 flex items-center space-x-2 text-sm active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>Thêm Config</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800 backdrop-blur-md shadow-xl">
            <div class="w-full sm:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-400"></i>
                <input type="text" id="searchInput" oninput="filterConfigs()" placeholder="Tìm kiếm tên config, đường dẫn..." class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-11 pr-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition shadow-inner">
            </div>
            <div class="text-sm text-zinc-300 flex items-center space-x-2 bg-zinc-950/60 px-4 py-2.5 rounded-xl border border-zinc-800">
                <i class="fa-solid fa-database text-cyan-400"></i>
                <span>Tổng số: <strong id="totalCount" class="rainbow-text font-bold">0</strong> config</span>
            </div>
        </div>

        <!-- Danh sách Config Grid -->
        <div id="configGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Render bằng JS -->
        </div>

        <!-- Trạng thái trống -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="bg-zinc-900/50 w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 border border-zinc-800 shadow-inner">
                <i class="fa-solid fa-file-code text-zinc-600 text-3xl"></i>
            </div>
            <p class="text-zinc-400 text-base font-medium">Chưa có config nào trên hệ thống.</p>
            <p class="text-zinc-500 text-xs mt-1">Bấm nút "Thêm Config" để bắt đầu tạo mới!</p>
        </div>
    </main>

    <!-- Modal Thêm/Sửa Config -->
    <div id="configModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-zinc-800/80 border-b border-zinc-700/60 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg text-white flex items-center space-x-2">
                    <i class="fa-solid fa-file-pen text-pink-400"></i>
                    <span>Thêm Config Mới</span>
                </h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-1 rounded-lg transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="configForm" onsubmit="saveConfig(event)" class="p-6 space-y-4">
                <input type="hidden" id="configId">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Tên Config</label>
                    <input type="text" id="configName" placeholder="VD: Velocity Config, BungeeGuard..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Đường Dẫn / File</label>
                    <input type="text" id="configPath" placeholder="VD: /velocity.toml" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition font-mono text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Nội Dung Config (YAML / TOML / JSON)</label>
                    <textarea id="configContent" rows="6" placeholder="Dán nội dung cấu hình vào đây..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-300 focus:outline-none focus:border-purple-500 transition font-mono resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-xl text-sm font-medium transition">Hủy</button>
                    <button type="submit" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-500/30">Lưu Lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase & Main Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHFlSyZKhlDZtMJqEAOC1LZ5GzUpOUY5I",
            authDomain: "proxy-b73b2.firebaseapp.com",
            databaseURL: "https://proxy-b73b2-default-rtdb.firebaseio.com",
            projectId: "proxy-b73b2",
            storageBucket: "proxy-b73b2.firebasestorage.app",
            messagingSenderId: "205093010784",
            appId: "1:205093010784:web:0c5866ff8eb18549d1b205",
            measurementId: "G-3KSWYRMJD4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const configsRef = ref(db, 'configs');

        let configsList = [];

        // Lấy dữ liệu Realtime từ Firebase, nếu lỗi chuyển sang dùng localStorage dự phòng
        onValue(configsRef, (snapshot) => {
            const data = snapshot.val();
            configsList = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    configsList.push({ id: key, ...data[key] });
                });
            } else {
                // Nếu Firebase trống, thử lấy từ localStorage dự phòng
                const localData = JSON.parse(localStorage.getItem('backup_configs')) || [];
                configsList = localData;
            }
            renderConfigs(configsList);
        }, (error) => {
            console.warn("Lỗi kết nối Firebase, chuyển sang chế độ LocalStorage cục bộ:", error);
            configsList = JSON.parse(localStorage.getItem('backup_configs')) || [];
            renderConfigs(configsList);
        });

        window.renderConfigs = function(data) {
            const grid = document.getElementById('configGrid');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('totalCount').innerText = configsList.length;

            grid.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/70 border border-zinc-800/80 rounded-2xl p-5 flex flex-col justify-between shadow-xl hover:border-purple-500/50 transition duration-300 group backdrop-blur-md relative overflow-hidden';
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 opacity-70 group-hover:opacity-100 transition"></div>
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-base text-white truncate max-w-[180px]" title="${item.name}">${item.name}</h3>
                            <span class="text-[11px] text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20 font-mono">${item.path}</span>
                        </div>
                        <pre class="bg-zinc-950/80 p-3 rounded-xl border border-zinc-800/80 text-zinc-300 text-xs font-mono h-24 overflow-hidden mb-3 select-all">${item.content}</pre>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-zinc-800/80">
                        <button onclick="copyContent(\`${encodeURIComponent(item.content)}\`)" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-md">
                            <i class="fa-solid fa-copy"></i> <span>Sao chép</span>
                        </button>
                        <div class="space-x-1">
                            <button onclick="editConfig('${item.id}', \`${encodeURIComponent(item.name)}\`, \`${encodeURIComponent(item.path)}\`, \`${encodeURIComponent(item.content)}\`)" class="text-zinc-400 hover:text-cyan-400 p-2 rounded-lg hover:bg-zinc-800 transition" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteConfig('${item.id}')" class="text-zinc-400 hover:text-rose-400 p-2 rounded-lg hover:bg-zinc-800 transition" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        window.openModal = function() {
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-file-pen text-pink-400 mr-2"></i>Thêm Config Mới';
            document.getElementById('configForm').reset();
            document.getElementById('configId').value = '';
        }

        window.closeModal = function() {
            document.getElementById('configModal').classList.add('hidden');
        }

        window.saveConfig = function(e) {
            e.preventDefault();
            const id = document.getElementById('configId').value;
            const name = document.getElementById('configName').value;
            const path = document.getElementById('configPath').value;
            const content = document.getElementById('configContent').value;

            try {
                if (id === "") {
                    const newRef = push(configsRef);
                    set(newRef, { name, path, content });
                } else {
                    const itemRef = ref(db, 'configs/' + id);
                    set(itemRef, { name, path, content });
                }
            } catch (err) {
                // Dự phòng lưu cục bộ nếu Firebase lỗi ghi
                let localData = JSON.parse(localStorage.getItem('backup_configs')) || [];
                if (id === "") {
                    localData.unshift({ id: 'local_' + Date.now(), name, path, content });
                } else {
                    const idx = localData.findIndex(i => i.id === id);
                    if (idx !== -1) localData[idx] = { id, name, path, content };
                }
                localStorage.setItem('backup_configs', JSON.stringify(localData));
                renderConfigs(localData);
            }
            closeModal();
        }

        window.editConfig = function(id, name, path, content) {
            document.getElementById('configModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-cyan-400 mr-2"></i>Chỉnh Sửa Config';
            document.getElementById('configId').value = id;
            document.getElementById('configName').value = decodeURIComponent(name);
            document.getElementById('configPath').value = decodeURIComponent(path);
            document.getElementById('configContent').value = decodeURIComponent(content);
        }

        window.deleteConfig = function(id) {
            if (confirm('Bạn có chắc chắn muốn xóa config này không?')) {
                try {
                    const itemRef = ref(db, 'configs/' + id);
                    remove(itemRef);
                } catch (e) {
                    let localData = JSON.parse(localStorage.getItem('backup_configs')) || [];
                    localData = localData.filter(i => i.id !== id);
                    localStorage.setItem('backup_configs', JSON.stringify(localData));
                    renderConfigs(localData);
                }
            }
        }

        window.copyContent = function(encodedContent) {
            const content = decodeURIComponent(encodedContent);
            navigator.clipboard.writeText(content).then(() => {
                alert('Đã sao chép nội dung config vào clipboard!');
            });
        }

        window.filterConfigs = function() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = configsList.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.path.toLowerCase().includes(keyword)
            );
            renderConfigs(filtered);
        }
    </script>
</body>
</html>
