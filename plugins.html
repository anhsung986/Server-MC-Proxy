<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server MC Proxy - Quản Lý Plugins</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rainbow-bg { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%); }
        .rainbow-text {
            background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .crossed-title {
            text-decoration: line-through !important;
            text-decoration-color: #ef4444 !important;
            text-decoration-thickness: 2px !important;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #ec4899, #8b5cf6); border-radius: 3px; }
    </style>
</head>
<body class="rainbow-bg text-gray-100 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-zinc-900/70 backdrop-blur-xl border-b border-zinc-800 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-500 p-2.5 rounded-2xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-puzzle-piece text-white text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider rainbow-text crossed-title">KHO PLUGINS</h1>
                    <p class="text-xs text-zinc-400">Quản lý file .jar & Plugin Minecraft</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <!-- Nút quay lại (Về Configs) là nút duy nhất hoạt động bình thường -->
                <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl font-semibold transition text-sm flex items-center space-x-2 border border-zinc-700">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden sm:inline">Về Configs</span>
                </a>
                <!-- Các nút khác bị khóa -->
                <button disabled class="bg-zinc-800 text-zinc-600 cursor-not-allowed px-5 py-2.5 rounded-xl font-semibold flex items-center space-x-2 text-sm opacity-50">
                    <i class="fa-solid fa-plus"></i>
                    <span>Thêm Plugin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800 backdrop-blur-md shadow-xl">
            <div class="w-full sm:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-400"></i>
                <input type="text" id="searchInput" disabled placeholder="Tính năng tìm kiếm đã khóa..." class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-11 pr-4 py-2.5 text-zinc-600 text-sm cursor-not-allowed">
            </div>
            <div class="text-sm text-zinc-300 flex items-center space-x-2 bg-zinc-950/60 px-4 py-2.5 rounded-xl border border-zinc-800">
                <i class="fa-solid fa-box text-pink-400"></i>
                <span>Tổng số: <strong id="totalCount" class="rainbow-text font-bold">0</strong> plugin</span>
            </div>
        </div>

        <!-- Danh sách Plugin Grid -->
        <div id="pluginGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Render bằng JS -->
        </div>

        <!-- Trạng thái trống -->
        <div id="emptyState" class="text-center py-20">
            <div class="bg-zinc-900/50 w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 border border-zinc-800 shadow-inner">
                <i class="fa-solid fa-puzzle-piece text-zinc-600 text-3xl"></i>
            </div>
            <p class="text-zinc-400 text-base font-medium">Chưa có plugin nào được lưu.</p>
            <p class="text-zinc-500 text-xs mt-1">Các chức năng thêm/sửa/xóa đã tạm khóa!</p>
        </div>
    </main>

    <!-- Firebase & Main Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHFlSyZKhlDZtMJqEAOC1LZ5GzUpOUY5I",
            authDomain: "proxy-b73b2.firebaseapp.com",
            databaseURL: "https://proxy-b73b2-default-rtdb.firebaseio.com",
            projectId: "proxy-b73b2",
            storageBucket: "proxy-b73b2.firebasestorage.app",
            messagingSenderId: "205093010784",
            appId: "1:205093010784:web:0c5866ff8eb18549d1b205",
            measurementId: "G-3KSWYRMJD4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pluginsRef = ref(db, 'plugins');

        let pluginsList = [];

        onValue(pluginsRef, (snapshot) => {
            const data = snapshot.val();
            pluginsList = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    pluginsList.push({ id: key, ...data[key] });
                });
            } else {
                pluginsList = JSON.parse(localStorage.getItem('backup_plugins')) || [];
            }
            renderPlugins(pluginsList);
        }, (error) => {
            pluginsList = JSON.parse(localStorage.getItem('backup_plugins')) || [];
            renderPlugins(pluginsList);
        });

        window.renderPlugins = function(data) {
            const grid = document.getElementById('pluginGrid');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('totalCount').innerText = pluginsList.length;

            grid.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            data.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/70 border border-zinc-800/80 rounded-2xl p-5 flex flex-col justify-between shadow-xl backdrop-blur-md relative overflow-hidden opacity-80';
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 opacity-70"></div>
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-base text-white truncate max-w-[160px]" title="${item.name}">${item.name}</h3>
                            <span class="bg-pink-500/10 text-pink-300 border border-pink-500/20 text-xs px-2.5 py-1 rounded-lg font-medium">${item.version}</span>
                        </div>
                        <div class="mb-3 flex items-center justify-between">
                            <span class="text-xs text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">Hỗ trợ: ${item.compat}</span>
                            <span class="text-[11px] text-zinc-400 font-mono truncate max-w-[130px]" title="${item.fileName}"><i class="fa-solid fa-file-zipper text-yellow-500 mr-1"></i>${item.fileName}</span>
                        </div>
                        <p class="text-xs text-zinc-300 bg-zinc-950/80 p-3 rounded-xl border border-zinc-800/80 min-h-[45px] line-clamp-2">${item.desc || 'Không có mô tả.'}</p>
                    </div>
                    <div class="flex justify-between items-center mt-5 pt-3 border-t border-zinc-800/80">
                        <!-- Khóa toàn bộ các nút hành động trên card -->
                        <button disabled class="bg-zinc-800 text-zinc-600 cursor-not-allowed px-3.5 py-1.5 rounded-xl text-xs font-medium flex items-center space-x-1.5 opacity-50">
                            <i class="fa-solid fa-ban"></i> <span>Đã Khóa</span>
                        </button>
                        <div class="space-x-1">
                            <button disabled class="text-zinc-600 p-2 rounded-lg cursor-not-allowed" title="Đã khóa"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button disabled class="text-zinc-600 p-2 rounded-lg cursor-not-allowed" title="Đã khóa"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
