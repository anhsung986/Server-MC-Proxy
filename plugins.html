<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server MC Proxy - Quản Lý Plugins</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .rainbow-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #09090b 100%);
        }
        .rainbow-text {
            background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6, #10b981, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #ec4899, #8b5cf6); border-radius: 3px; }
    </style>
</head>
<body class="rainbow-bg text-gray-100 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-zinc-900/70 backdrop-blur-xl border-b border-zinc-800 sticky top-0 z-40 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-pink-500 via-purple-500 to-cyan-500 p-2.5 rounded-2xl shadow-lg shadow-purple-500/20">
                    <i class="fa-solid fa-puzzle-piece text-white text-xl animate-pulse"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider rainbow-text">KHO PLUGINS</h1>
                    <p class="text-xs text-zinc-400">Quản lý file .jar & Plugin Minecraft</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="index.html" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2.5 rounded-xl font-semibold transition text-sm flex items-center space-x-2 border border-zinc-700">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span class="hidden sm:inline">Về Configs</span>
                </a>
                <button onclick="openModal()" class="bg-gradient-to-r from-pink-500 via-purple-600 to-blue-600 hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-semibold transition-all shadow-lg shadow-purple-500/30 flex items-center space-x-2 text-sm active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                    <span>Thêm Plugin</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Thanh tìm kiếm & Thống kê -->
        <div class="mb-6 flex flex-col sm:flex-row gap-4 justify-between items-center bg-zinc-900/60 p-4 rounded-2xl border border-zinc-800 backdrop-blur-md shadow-xl">
            <div class="w-full sm:w-1/2 relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-zinc-400"></i>
                <input type="text" id="searchInput" oninput="filterPlugins()" placeholder="Tìm kiếm tên plugin, phiên bản..." class="w-full bg-zinc-950/80 border border-zinc-800 rounded-xl pl-11 pr-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition shadow-inner">
            </div>
            <div class="text-sm text-zinc-300 flex items-center space-x-2 bg-zinc-950/60 px-4 py-2.5 rounded-xl border border-zinc-800">
                <i class="fa-solid fa-box text-pink-400"></i>
                <span>Tổng số: <strong id="totalCount" class="rainbow-text font-bold">0</strong> plugin</span>
            </div>
        </div>

        <!-- Danh sách Plugin Grid -->
        <div id="pluginGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Render bằng JS -->
        </div>

        <!-- Trạng thái trống -->
        <div id="emptyState" class="hidden text-center py-20">
            <div class="bg-zinc-900/50 w-20 h-20 mx-auto rounded-full flex items-center justify-center mb-4 border border-zinc-800 shadow-inner">
                <i class="fa-solid fa-puzzle-piece text-zinc-600 text-3xl"></i>
            </div>
            <p class="text-zinc-400 text-base font-medium">Chưa có plugin nào được lưu.</p>
            <p class="text-zinc-500 text-xs mt-1">Hãy bấm nút "Thêm Plugin" phía trên để bắt đầu!</p>
        </div>
    </main>

    <!-- Modal Thêm/Sửa Plugin -->
    <div id="pluginModal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50 transition-all">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 bg-zinc-800/80 border-b border-zinc-700/60 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-lg text-white flex items-center space-x-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i>
                    <span>Thêm Plugin Mới</span>
                </h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white p-1 rounded-lg transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="pluginForm" onsubmit="savePlugin(event)" class="p-6 space-y-4">
                <input type="hidden" id="pluginIndex">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Tên Plugin</label>
                    <input type="text" id="pluginName" placeholder="VD: LuckPerms, EssentialsX..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Phiên Bản</label>
                        <input type="text" id="pluginVersion" placeholder="VD: v5.4.32" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Tương Thích</label>
                        <input type="text" id="pluginCompat" placeholder="VD: 1.16 - 1.20+" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 focus:outline-none focus:border-purple-500 text-white text-sm transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Chọn File Plugin (.jar từ thiết bị)</label>
                    <div class="flex items-center space-x-3">
                        <label class="flex-1 bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-400 cursor-pointer hover:border-purple-500 transition flex items-center justify-between overflow-hidden">
                            <span id="fileNameDisplay" class="truncate">Chưa chọn file nào...</span>
                            <span class="bg-zinc-800 text-zinc-200 px-3 py-1 rounded-lg text-xs font-medium ml-2 shrink-0"><i class="fa-solid fa-folder-open mr-1"></i> Duyệt</span>
                            <input type="file" id="pluginFile" accept=".jar" onchange="handleFileSelect(event)" class="hidden">
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1.5">Mô Tả Ngắn</label>
                    <textarea id="pluginDesc" rows="2" placeholder="Mô tả công dụng chính của plugin..." class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-2.5 text-xs text-zinc-300 focus:outline-none focus:border-purple-500 transition resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-5 py-2.5 rounded-xl text-sm font-medium transition">Hủy</button>
                    <button type="submit" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white px-6 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-purple-500/30">Lưu Lại</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let plugins = JSON.parse(localStorage.getItem('server_mc_proxy_plugins')) || [];
        let selectedFileBase64 = '';
        let selectedFileName = '';

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedFileName = file.name;
            document.getElementById('fileNameDisplayinnerText').innerText = selectedFileName;
            document.getElementById('fileNameDisplay').innerText = selectedFileName;
            document.getElementById('fileNameDisplay').className = "truncate text-pink-300 font-mono";

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedFileBase64 = e.target.result; // Lưu dưới dạng mã hóa base64 để lưu vào localStorage
            };
            reader.readAsDataURL(file);
        }

        function renderPlugins(data = plugins) {
            const grid = document.getElementById('pluginGrid');
            const emptyState = document.getElementById('emptyState');
            document.getElementById('totalCount').innerText = plugins.length;

            grid.innerHTML = '';
            if (data.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            data.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/70 border border-zinc-800/80 rounded-2xl p-5 flex flex-col justify-between shadow-xl hover:border-purple-500/50 transition duration-300 group backdrop-blur-md relative overflow-hidden';
                card.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 opacity-70 group-hover:opacity-100 transition"></div>
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-base text-white truncate max-w-[160px]" title="${item.name}">${item.name}</h3>
                            <span class="bg-pink-500/10 text-pink-300 border border-pink-500/20 text-xs px-2.5 py-1 rounded-lg font-medium">${item.version}</span>
                        </div>
                        <div class="mb-3 flex items-center justify-between">
                            <span class="text-xs text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">Hỗ trợ: ${item.compat}</span>
                            <span class="text-[11px] text-zinc-400 font-mono truncate max-w-[130px]" title="${item.fileName}"><i class="fa-solid fa-file-zipper text-yellow-500 mr-1"></i>${item.fileName}</span>
                        </div>
                        <p class="text-xs text-zinc-300 bg-zinc-950/80 p-3 rounded-xl border border-zinc-800/80 min-h-[45px] line-clamp-2">${item.desc || 'Không có mô tả.'}</p>
                    </div>
                    <div class="flex justify-between items-center mt-5 pt-3 border-t border-zinc-800/80">
                        <button onclick="downloadPluginFile(${index})" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:opacity-90 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium transition flex items-center space-x-1.5 shadow-md">
                            <i class="fa-solid fa-download"></i> <span>Tải File .jar</span>
                        </button>
                        <div class="space-x-1">
                            <button onclick="editPlugin(${index})" class="text-zinc-400 hover:text-cyan-400 p-2 rounded-lg hover:bg-zinc-800 transition" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deletePlugin(${index})" class="text-zinc-400 hover:text-rose-400 p-2 rounded-lg hover:bg-zinc-800 transition" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal() {
            document.getElementById('pluginModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-wand-magic-sparkles text-pink-400 mr-2"></i>Thêm Plugin Mới';
            document.getElementById('pluginForm').reset();
            document.getElementById('pluginIndex').value = '';
            document.getElementById('fileNameDisplay').innerText = 'Chưa chọn file nào...';
            document.getElementById('fileNameDisplay').className = "truncate text-zinc-400";
            selectedFileBase64 = '';
            selectedFileName = '';
        }

        function closeModal() {
            document.getElementById('pluginModal').classList.add('hidden');
        }

        function savePlugin(e) {
            e.preventDefault();
            const index = document.getElementById('pluginIndex').value;
            const name = document.getElementById('pluginName').value;
            const version = document.getElementById('pluginVersion').value;
            const compat = document.getElementById('pluginCompat').value;
            const desc = document.getElementById('pluginDesc').value;

            // Nếu đang sửa mà không chọn file mới thì giữ nguyên file cũ
            if (index !== '' && !selectedFileBase64) {
                selectedFileBase64 = plugins[index].fileData;
                selectedFileName = plugins[index].fileName;
            }

            if (!selectedFileBase64) {
                alert('Vui lòng chọn một file .jar từ thiết bị!');
                return;
            }

            const pluginItem = { 
                name, 
                version, 
                compat, 
                desc, 
                fileName: selectedFileName, 
                fileData: selectedFileBase64 
            };

            if (index === '') {
                plugins.unshift(pluginItem);
            } else {
                plugins[index] = pluginItem;
            }

            localStorage.setItem('server_mc_proxy_plugins', JSON.stringify(plugins));
            closeModal();
            renderPlugins();
        }

        function editPlugin(index) {
            const item = plugins[index];
            document.getElementById('pluginModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-cyan-400 mr-2"></i>Chỉnh Sửa Plugin';
            document.getElementById('pluginIndex').value = index;
            document.getElementById('pluginName').value = item.name;
            document.getElementById('pluginVersion').value = item.version;
            document.getElementById('pluginCompat').value = item.compat;
            document.getElementById('pluginDesc').value = item.desc;
            
            selectedFileBase64 = item.fileData;
            selectedFileName = item.fileName;
            document.getElementById('fileNameDisplay').innerText = selectedFileName;
            document.getElementById('fileNameDisplay').className = "truncate text-pink-300 font-mono";
        }

        function deletePlugin(index) {
            if (confirm('Bạn có chắc chắn muốn xóa plugin này không?')) {
                plugins.splice(index, 1);
                localStorage.setItem('server_mc_proxy_plugins', JSON.stringify(plugins));
                renderPlugins();
            }
        }

        function downloadPluginFile(index) {
            const item = plugins[index];
            if (!item.fileData) {
                alert('Không tìm thấy dữ liệu file!');
                return;
            }
            const a = document.createElement('a');
            a.href = item.fileData;
            a.download = item.fileName || 'plugin.jar';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function filterPlugins() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = plugins.filter(item => 
                item.name.toLowerCase().includes(keyword) || 
                item.version.toLowerCase().includes(keyword) ||
                item.compat.toLowerCase().includes(keyword)
            );
            renderPlugins(filtered);
        }

        renderPlugins();
    </script>
</body>
</html>
